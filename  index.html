<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Yihui Zhu — visual artist / author</title>
<link rel="icon" href="yihuizhu-portfolio/assets/images/favicon/yihui-favicon.svg" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Space+Grotesk:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2F1EC;--paper:#F8F8F4;--ink:#20201D;--mid:#666660;--mute:#92928A;--line:#D8D8D1;
  --acc:#D95743;--acc-soft:rgba(217,87,67,.08);
  --ser:"Fraunces","EB Garamond",Garamond,Georgia,serif;
  --sans:"Space Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --meta:"Space Grotesk",ui-monospace,monospace;
  --cn-title:"Noto Serif SC","LXGW WenKai Web",serif;
  --cn-body:"Noto Serif SC","LXGW WenKai Web","Songti SC",serif;
  --nav:168px;--ease:cubic-bezier(.22,1,.36,1);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:13px;line-height:1.7;min-height:100%;letter-spacing:.005em}
body.zh{font-family:var(--cn-body)}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:8000;opacity:.012;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px;
}
.h{display:none}body.zh .e{display:none}body.zh .h{display:inline}body.zh .h.blk{display:block}
body.zh .ser-tx,body.zh .home-state,body.zh .home-bio,body.zh .wh-intro,body.zh .bw-intro,body.zh .abio,body.zh .ppin,body.zh .ppde,body.zh .ppsu{font-family:var(--cn-body);font-style:normal;letter-spacing:.04em}
body.zh .home-name,body.zh .wh-title,body.zh .bw-title,body.zh .aname,body.zh .ppti,body.zh .folio-title,body.zh .folio-sub,body.zh .chead{font-family:var(--cn-title);font-weight:400;letter-spacing:.08em}
a{color:inherit}
button,a,article{cursor:pointer}

/* NAV */
#nav{position:fixed;top:0;left:0;bottom:0;width:var(--nav);background:var(--paper);border-right:1px solid var(--line);z-index:200;display:flex;flex-direction:column;padding:28px 22px 24px}
.nlogo{display:block;margin-bottom:44px;text-decoration:none;flex-shrink:0}
.nlogo img{height:48px;width:auto;display:block;opacity:.85;transition:opacity .4s}
.nlogo:hover img{opacity:.45}
.nlist{list-style:none;display:flex;flex-direction:column;gap:0;flex:1}
.nl{display:flex;align-items:baseline;gap:10px;font-family:var(--meta);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);text-decoration:none;padding:9px 0;transition:color .35s}
.nl::before{content:"";display:inline-block;width:0;height:1px;background:var(--acc);transition:width .4s var(--ease),background .4s}
.nl:hover{color:var(--mid)}
.nl:hover::before{width:8px;background:var(--acc)}
.nl.act{color:var(--ink)}
.nl.act::before{width:14px;background:var(--acc)}
.nl.quiet{font-size:9px;color:var(--mute);margin-top:auto;padding-top:20px;opacity:.7}
.nl.quiet.act::before{width:8px}
.nsep{height:1px;background:transparent;margin:14px 0}
.nfoot{display:flex;flex-direction:column;gap:18px}
.lbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:0;font-family:var(--meta);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.lbtn:hover{color:var(--acc)}
.ldot{width:4px;height:4px;border-radius:50%;background:var(--acc);opacity:.55}
.ncopy{font-size:9px;color:var(--mute);line-height:1.7;opacity:.6;letter-spacing:.04em}

#stage{margin-left:var(--nav);width:calc(100% - var(--nav));position:relative;background:var(--paper)}
.panel{min-height:100vh;border-bottom:1px solid var(--line)}

/* HOME */
#p-home{position:relative;overflow:hidden;background:var(--paper);min-height:100vh;display:flex;align-items:stretch}
.home-grid{display:grid;grid-template-columns:1.05fr 1fr;width:100%;min-height:100vh}
.home-copy{display:flex;flex-direction:column;justify-content:center;padding:96px 64px 96px 88px;max-width:680px}
.home-ey{font-family:var(--sans);font-size:11px;color:var(--acc);margin-bottom:24px;letter-spacing:.04em;text-transform:uppercase}
.home-name{font-family:var(--ser);font-size:clamp(56px,7vw,112px);font-weight:400;line-height:.92;margin-bottom:18px;letter-spacing:-.025em}
body.zh .home-name{font-family:var(--cn-title);font-weight:300}
.home-name .e{text-transform:uppercase;letter-spacing:.02em}
.home-role{font-family:var(--sans);font-size:12px;color:var(--mid);margin-bottom:32px;font-weight:400;letter-spacing:.08em;text-transform:uppercase}
.home-bio{font-family:var(--ser);font-size:18px;font-style:italic;line-height:1.7;color:var(--ink);max-width:440px;font-weight:300;letter-spacing:.005em}
body.zh .home-bio{font-family:var(--cn-body);font-style:normal;line-height:1.85;font-size:15px}
.home-meta{margin-top:36px;display:flex;align-items:center;gap:14px;font-family:var(--sans);font-size:11px;color:var(--mute);letter-spacing:.18em;text-transform:uppercase}
.home-meta span:first-child{width:36px;height:1px;background:var(--line);display:inline-block}
.home-visual{position:relative;display:flex;align-items:center;justify-content:center;padding:48px;background:var(--bg);border-left:1px solid var(--line);overflow:hidden}
.home-frame{width:min(460px,82%);aspect-ratio:4/5;position:relative;border:1px solid var(--line);background:var(--acc-soft);overflow:hidden}
.home-frame img{width:100%;height:100%;object-fit:cover;display:block}
.home-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--paper)}
.home-ph svg{opacity:.25;color:var(--acc)}
.home-ph span{font-family:var(--sans);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.home-index{position:absolute;bottom:36px;right:44px;font-family:var(--ser);font-size:clamp(96px,11vw,160px);font-style:italic;color:transparent;-webkit-text-stroke:1px rgba(217,87,67,.18);line-height:1;pointer-events:none;user-select:none;letter-spacing:-.04em}
.home-tags{position:absolute;top:36px;left:40px;display:flex;flex-direction:column;gap:8px}
.home-tag{font-family:var(--sans);font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}

/* CURSOR */
#cur{position:fixed;width:5px;height:5px;background:var(--acc);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .12s}
#crn{position:fixed;width:24px;height:24px;border:1px solid var(--acc);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);opacity:.3;transition:width .3s,height .3s,opacity .3s}

/* SECTION HEADS */
.work-head{padding:72px 6vw 36px;max-width:920px}
.wh-k{font-family:var(--meta);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-bottom:20px}
.wh-title{font-family:var(--ser);font-size:clamp(40px,5vw,72px);font-weight:400;line-height:1.02;margin-bottom:22px;letter-spacing:-.015em}
.wh-title em{font-style:italic;color:var(--acc)}
.wh-intro{font-family:var(--ser);font-size:19px;font-style:italic;line-height:1.6;color:var(--mid);max-width:38em}

/* BODIES OF WORK */
.bodies{padding:8px 6vw 72px;display:flex;flex-direction:column;gap:64px}
.body-work{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
.body-work.flip{grid-template-columns:.85fr 1.15fr}
.body-work.flip .bw-img{order:2}
.body-work.plate{grid-template-columns:1fr;min-height:42vh;border:1px solid var(--line);padding:48px 40px;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent)}
.bw-img{position:relative}
.bw-img img{width:100%;height:auto;display:block;max-height:72vh;object-fit:contain;object-position:left center;background:transparent;box-shadow:none}
.bw-copy{max-width:420px}
.bw-meta{font-family:var(--meta);font-size:10px;color:var(--mute);letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px}
.bw-title{font-family:var(--ser);font-size:clamp(34px,3.6vw,52px);font-weight:400;line-height:1.05;margin-bottom:14px;letter-spacing:-.01em}
.bw-sub{font-family:var(--ser);font-style:italic;font-size:15px;color:var(--mid);margin-bottom:18px}
.bw-intro{font-family:var(--ser);font-size:17px;font-style:italic;line-height:1.65;color:var(--mid);margin-bottom:24px}
.bw-open{font-family:var(--meta);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);background:none;border:none;padding:0;display:inline-flex;align-items:center;gap:8px;transition:color .3s}
.bw-open::after{content:"→";font-family:var(--ser);font-size:14px;letter-spacing:0;transition:transform .3s var(--ease)}
.bw-open:hover{color:var(--acc)}
.bw-open:hover::after{transform:translateX(4px)}

/* FRAGMENTS */
.frag-filters{display:flex;flex-wrap:wrap;gap:10px 22px;padding:4px 6vw 36px;align-items:baseline}
.ff{background:none;border:none;font-family:var(--meta);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding:0 0 3px;border-bottom:1px solid transparent;transition:color .4s,border-color .4s}
.ff:hover,.ff.on{color:var(--ink);border-bottom-color:var(--ink)}
.frag-field{padding:0 5vw 110px 6vw;display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:2.6vw;row-gap:8.5vh}
.frag{background:none;border:none;text-align:left;padding:0;position:relative;display:flex;flex-direction:column;align-items:flex-start;transform:rotate(var(--r,0deg));transition:opacity .55s;z-index:1}
.frag:hover,.frag:focus{z-index:4}
.frag.is-out{display:none}
.frag img,.frag-plate{display:block;width:100%;height:auto;box-shadow:none;transition:opacity .4s}
.frag:hover img,.frag:hover .frag-plate{opacity:.94}
.frag-plate{background:var(--paper);border:1px solid var(--line);padding:1.35em 1.2em 1.5em;min-height:8em;font-family:var(--ser);font-style:italic;font-size:clamp(13px,1.15vw,17px);line-height:1.55;color:var(--ink)}
body.zh .frag-plate{font-family:var(--cn-body);font-style:normal}
.frag-meta{margin-top:10px;font-size:10px;line-height:1.6;color:var(--mute);min-height:4.4em;opacity:0;transform:translateY(5px);transition:opacity .45s,transform .45s;pointer-events:none}
.frag:hover .frag-meta,.frag:focus .frag-meta{opacity:1;transform:none}
.frag-kind{display:block;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px;color:var(--ink)}
.frag.xs{width:8%;min-width:70px}
.frag.s{width:13.5%}
.frag.m{width:21%}
.frag.l{width:31%}
.frag.xl{width:46%}
.frag.full{width:100%;transform:none;margin:2vh 0 1vh;align-items:stretch}
.frag.full img{width:auto;max-width:100%;max-height:76vh;margin:0 auto}
.frag.ov{margin-left:-3.2vw;margin-bottom:-3vh;z-index:2}
.frag.nudge{margin-top:-2.4vh}

/* fragment slip */
.slip{position:fixed;inset:0;z-index:860;display:none;background:rgba(248,248,244,.985);padding:28px 5vw;overflow:auto}
.slip.on{display:block}
.slip-close{position:sticky;top:0;float:right;background:none;border:1px solid var(--line);width:30px;height:30px;font-size:15px;color:var(--mute);z-index:2}
.slip-close:hover{border-color:var(--acc);color:var(--acc)}
.slip-body{max-width:1100px;margin:28px auto 60px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(220px,.55fr);gap:48px;align-items:start;clear:both}
.slip-fig{margin:0}
.slip-fig img{width:100%;height:auto;display:block;max-height:86vh;object-fit:contain;box-shadow:none}
.slip-plate{font-family:var(--ser);font-style:italic;font-size:clamp(22px,3.2vw,36px);line-height:1.45;padding:8vh 0}
body.zh .slip-plate{font-family:var(--cn-title);font-style:normal}
.slip-side{padding-top:8px;position:sticky;top:36px}
.slip-k{font-family:var(--meta);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:16px}
.slip-title{font-family:var(--ser);font-size:clamp(26px,3vw,40px);line-height:1.08;margin-bottom:14px;letter-spacing:-.01em}
.slip-facts{font-size:12px;color:var(--mid);line-height:1.95;margin-bottom:24px}
.slip-rel{background:none;border:none;font-family:var(--meta);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);padding:0;display:inline-flex;align-items:center;gap:8px;transition:color .3s}
.slip-rel::after{content:"→";font-family:var(--ser);font-size:14px;letter-spacing:0;transition:transform .3s var(--ease)}
.slip-rel:hover{color:var(--acc)}
.slip-rel:hover::after{transform:translateX(4px)}
.slip-nav{margin-top:28px;font-size:11px;color:var(--mute);display:flex;gap:16px}
.slip-nav button{background:none;border:none;font:inherit;color:inherit;padding:0;letter-spacing:.08em}
.slip-nav button:hover{color:var(--ink)}

/* ARCHIVE LEDGER */
.ledger{padding:0 6vw 80px}
.led-row{display:grid;grid-template-columns:72px 1.4fr .9fr 88px 72px;gap:16px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--mid);background:none;width:100%;text-align:left}
.led-row:first-child{border-top:1px solid var(--line)}
.led-row:hover{color:var(--ink)}
.led-title{font-family:var(--ser);font-size:18px;color:var(--ink)}
.led-head{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding-bottom:8px;border-bottom:1px solid var(--line)}

/* DESIGN PRACTICE */
.design-list{padding:0 6vw 72px;display:flex;flex-direction:column}
.ditem{display:grid;grid-template-columns:96px 1fr auto;gap:20px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.ditem:first-child{border-top:1px solid var(--line)}
.dthumb{width:96px;height:64px;overflow:hidden;border:1px solid var(--line)}
.dthumb img{width:100%;height:100%;object-fit:cover;display:block}
.dtitle{font-family:var(--ser);font-size:20px;line-height:1.15;letter-spacing:-.01em}
.dsub{font-family:var(--meta);font-size:10px;color:var(--mute);letter-spacing:.04em;margin-top:6px}
.dyr{font-size:11px;color:var(--mute)}

/* ABOUT */
.about-wrap{padding:72px 6vw 96px;max-width:900px}
.about-top{display:grid;grid-template-columns:148px 1fr;gap:44px;margin-bottom:56px;padding-bottom:44px;border-bottom:1px solid var(--line)}
.aport{width:148px;aspect-ratio:4/5;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.aport img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.aname{font-family:var(--ser);font-size:38px;margin-bottom:10px;letter-spacing:-.01em}
.arole{font-family:var(--meta);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:22px}
.abio{font-family:var(--ser);font-size:18px;font-style:italic;line-height:1.7;color:var(--mid)}
.abio p{margin-bottom:14px}
.chead{font-family:var(--ser);font-size:clamp(28px,3.4vw,44px);margin:8px 0 24px;letter-spacing:-.01em}
.clist{list-style:none;color:var(--mid);line-height:2.1}
.ebtn{display:inline-flex;align-items:center;gap:10px;margin-top:24px;color:var(--ink);background:none;text-decoration:none;padding:6px 0;font-family:var(--meta);font-size:10px;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid var(--ink);transition:color .3s,border-color .3s,gap .3s}
.ebtn:hover{color:var(--acc);border-color:var(--acc);gap:14px}
.cvl{font-family:var(--meta);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin:44px 0 20px;display:flex;align-items:center;gap:12px}
.cvl::after{content:"";flex:1;height:1px;background:var(--line)}
.cvg{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.cvi{margin-bottom:22px}
.cvyr{font-size:11px;color:var(--mute);margin-bottom:6px}
.cvti{font-family:var(--ser);font-size:18px;margin-bottom:4px}
.cvsu,.cvbo{font-size:12px;color:var(--mid);line-height:1.7}
.skg{display:flex;flex-wrap:wrap;gap:8px}
.sk{font-size:12px;color:var(--mid);border-bottom:1px solid var(--line);padding:4px 2px}
.lgi{margin-bottom:10px;max-width:360px}
.lgrow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.lgbar{height:1px;background:var(--line)}
.lgfi{height:1px;background:var(--ink);width:0;transition:width 1.2s var(--ease)}

/* FOLIO / PROJECT PAGE */
.pov{position:fixed;inset:0;z-index:500;background:rgba(26,25,22,0);pointer-events:none;transition:background .5s}
.pov.on{background:rgba(32,32,29,.18);pointer-events:all}
.folio{position:fixed;inset:0 0 0 var(--nav);z-index:501;background:var(--paper);transform:translateY(8px);opacity:0;pointer-events:none;overflow-y:auto;transition:opacity .5s,transform .6s var(--ease)}
.folio.on{transform:none;opacity:1;pointer-events:all}
.folio-bar{position:sticky;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:rgba(248,248,244,.94);border-bottom:1px solid var(--line)}
.folio-close{background:none;border:1px solid var(--line);width:30px;height:30px;font-size:15px;color:var(--mute);transition:border-color .3s,color .3s}
.folio-close:hover{border-color:var(--acc);color:var(--acc)}
.folio-inner{padding:36px 7vw 80px}
.folio-k{font-family:var(--meta);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:16px}
.folio-title{font-family:var(--ser);font-size:clamp(34px,4.8vw,64px);line-height:1.02;margin-bottom:14px;max-width:18em;letter-spacing:-.01em}
.folio-sub{font-family:var(--ser);font-style:italic;font-size:18px;line-height:1.45;color:var(--mid);margin-bottom:24px;max-width:36em}
.folio-facts{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--meta);font-size:10px;letter-spacing:.06em;color:var(--mute);margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.ppin{font-family:var(--ser);font-size:22px;font-style:italic;line-height:1.55;max-width:30em;margin-bottom:24px}
.ppde{font-size:14px;line-height:1.85;color:var(--mid);max-width:38em;margin-bottom:40px}
.seq{display:flex;flex-direction:column;gap:32px;margin:8px 0 48px}
.seq img,.seq .media{width:100%;height:auto;display:block;cursor:zoom-in}
.seq.vary .media:nth-child(3n){width:78%;margin-left:auto}
.seq.vary .media:nth-child(3n+1){width:92%}
.seq.spread{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.seq.spread .media:first-child{grid-column:1/-1}
.cap{font-family:var(--meta);font-size:10px;letter-spacing:.04em;color:var(--mute);margin-top:8px}
.site-link{display:inline-flex;align-items:center;gap:8px;margin:8px 0 28px;font-family:var(--meta);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:4px;transition:color .3s,border-color .3s}
.site-link:hover{color:var(--acc);border-color:var(--acc)}
.ppcr{font-family:var(--meta);font-size:10px;line-height:1.9;color:var(--mute);border-top:1px solid var(--line);padding-top:18px;max-width:40em;letter-spacing:.04em}
.blank-plate{min-height:40vh;display:flex;align-items:center;border:1px solid var(--line);padding:48px;margin-bottom:32px;font-family:var(--ser);font-style:italic;font-size:24px;color:var(--mid)}
.layout-compact .folio-title{font-size:clamp(22px,3vw,36px)}
.layout-compact .ppin{font-size:16px;max-width:34em}

#zoom{position:fixed;inset:0;z-index:900;background:rgba(32,32,29,.82);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#zoom.on{display:flex}
#zoom img{max-width:96vw;max-height:94vh;box-shadow:0 20px 80px rgba(0,0,0,.4)}

@media(max-width:960px){
  :root{--nav:0px}
  #nav{position:fixed;top:0;left:0;right:0;bottom:auto;width:100%;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;overflow-x:auto}
  .nlogo{margin-bottom:0}
  .nlogo img{height:40px}
  .nlist{flex-direction:row;gap:4px 16px;overflow-x:auto}
  .nl{padding:6px 0;white-space:nowrap}
  .nl.quiet{margin-top:0;padding-top:6px}
  .nsep,.ncopy{display:none}
  .nfoot{margin-top:0;flex-direction:row}
  #stage{margin-left:0;width:100%;padding-top:56px}
  .folio{inset:56px 0 0 0}
  .home-grid{grid-template-columns:1fr;min-height:calc(100vh - 56px)}
  .home-copy{padding:48px 24px 56px;max-width:none}
  .home-visual{padding:24px;border-left:none;border-top:1px solid var(--line);min-height:340px}
  .home-frame{width:min(320px,70%)}
  #cur,#crn{display:none}
  .body-work,.body-work.flip{grid-template-columns:1fr;gap:18px}
  .body-work.flip .bw-img{order:0}
  .frag.xs,.frag.s{width:28%}
  .frag.m,.frag.l{width:46%}
  .frag.xl,.frag.full{width:100%}
  .frag.ov,.frag.nudge{margin:0}
  .slip-body{grid-template-columns:1fr;gap:24px}
  .slip-side{position:static}
  .led-row,.led-head{grid-template-columns:64px 1fr 72px; }
  .led-row span:nth-child(3),.led-row span:nth-child(5),.led-head span:nth-child(3),.led-head span:nth-child(5){display:none}
  .ditem{grid-template-columns:72px 1fr}
  .about-top,.cvg,.seq.spread{grid-template-columns:1fr}
  .seq.vary .media,.seq.vary .media:nth-child(3n),.seq.vary .media:nth-child(3n+1){width:100%}
}
@media(max-width:560px){
  .frag.xs,.frag.s,.frag.m{width:46%}
  .frag.l,.frag.xl,.frag.full{width:100%}
  .home-name{font-size:46px}
  .home-copy{padding:36px 20px 44px}
  .home-bio{font-size:16px}
  .home-index{font-size:80px;bottom:18px;right:20px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<div id="cur"></div>
<div id="crn"></div>
<div class="pov" id="pov" onclick="cpop()"></div>
<article class="folio" id="folio" aria-hidden="true">
  <div class="folio-bar">
    <span id="folio-k" class="folio-k"></span>
    <button class="folio-close" type="button" onclick="cpop()" aria-label="Close">&#215;</button>
  </div>
  <div class="folio-inner" id="folio-inner"></div>
</article>
<div id="zoom" onclick="this.classList.remove('on')"><img id="zoomimg" alt=""/></div>
<div class="slip" id="slip" aria-hidden="true">
  <button class="slip-close" type="button" onclick="closeFrag()" aria-label="Close">&#215;</button>
  <div class="slip-body" id="slip-body"></div>
</div>

<nav id="nav">
  <a href="#p-home" class="nlogo"><img src="yihuizhu-portfolio/assets/images/homepage/yihui-logo.svg" alt="Yihui Zhu"/></a>
  <ul class="nlist" id="navList"></ul>
  <div class="nfoot">
    <button class="lbtn" id="lbtn" type="button" onclick="tgl()"><span class="ldot"></span><span id="llbl">中文</span></button>
    <span class="ncopy">&#169; Yihui Zhu — works, notes &amp; archives</span>
  </div>
</nav>

<main id="stage">
  <section class="panel" id="p-home" data-id="home">
    <div class="home-grid">
      <div class="home-copy">
        <p class="home-ey" id="home-ey"></p>
        <h1 class="home-name" id="home-name"></h1>
        <p class="home-role" id="home-role"></p>
        <p class="home-bio ser-tx" id="home-bio"></p>
        <div class="home-meta"><span></span><span id="home-loc"></span></div>
      </div>
      <div class="home-visual">
        <div class="home-frame">
          <img id="home-photo-img" src="yihuizhu-portfolio/assets/images/about/yihui-profile.png" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
          <div class="home-ph" id="home-fph-placeholder" style="display:none">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <span>Portrait</span>
          </div>
        </div>
        <span class="home-index">YZ</span>
      </div>
    </div>
  </section>
  <div id="sectionsWrap"></div>
  <section class="panel" id="p-about" data-id="about">
    <div class="about-wrap" id="aboutWrap"></div>
  </section>
</main>

<script src="site-content.js"></script>
<script>
(function(){
  var curPop=-1, lgDone=false;

  function bi(en,zh){return '<span class="e">'+en+'</span><span class="h">'+zh+'</span>';}
  function bih(en,zh){return '<span class="e">'+en+'</span><span class="h blk">'+zh+'</span>';}
  function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
  function zhNow(){return document.body.classList.contains("zh");}
  function idxOf(id){
    for(var i=0;i<SITE.projects.length;i++) if(SITE.projects[i].id===id) return i;
    return -1;
  }
  function media(src, cls, zoom){
    if(!src) return "";
    var z=zoom?' onclick="event.stopPropagation();zoomImg(this.src)" style="cursor:zoom-in"':"";
    return '<div class="'+(cls||"media")+'"><img src="'+esc(src)+'" alt=""'+z+"/></div>";
  }

  /* NAV */
  var navList=document.getElementById("navList");
  SITE.nav.forEach(function(n){
    if(n.quiet){var sep=document.createElement("div");sep.className="nsep";navList.appendChild(sep);}
    var li=document.createElement("li");
    li.innerHTML='<a class="nl'+(n.quiet?" quiet":"")+'" href="#p-'+n.id+'">'+bi(n.labelEn,n.labelZh)+'</a>';
    navList.appendChild(li);
  });

  /* HOME */
  var h=SITE.home;
  document.getElementById("home-ey").innerHTML=bi(h.eyebrowEn,h.eyebrowZh);
  document.getElementById("home-name").innerHTML=bih(h.nameEnHtml,h.nameZhHtml);
  document.getElementById("home-role").innerHTML=bi(h.roleEn,h.roleZh);
  document.getElementById("home-bio").innerHTML=bi(h.statementEn,h.statementZh);
  document.getElementById("home-loc").innerHTML=bi(h.locationEn,h.locationZh);

  /* CURSOR */
  var CC=document.getElementById("cur"),CR=document.getElementById("crn"),mx=0,my=0,rx=0,ry=0;
  document.addEventListener("mousemove",function(e){mx=e.clientX;my=e.clientY;if(CC){CC.style.left=mx+"px";CC.style.top=my+"px";}});
  (function lp(){rx+=(mx-rx)*.14;ry+=(my-ry)*.14;if(CR){CR.style.left=rx+"px";CR.style.top=ry+"px";}requestAnimationFrame(lp);})();
  document.querySelectorAll("a,button,.witem,.frag,.sk,.ppx,.ebtn,.ff,.led-row,.ditem").forEach(function(el){
    el.addEventListener("mouseenter",function(){document.body.classList.add("hov");});
    el.addEventListener("mouseleave",function(){document.body.classList.remove("hov");});
  });

  function bodies(){
    return SITE.projects.filter(function(p){return p.group==="work";})
      .sort(function(a,b){return (a.rank||99)-(b.rank||99);});
  }
  function designWorks(){return SITE.projects.filter(function(p){return p.group==="design";});}

  function relatedProject(id){
    if(!id) return null;
    for(var i=0;i<SITE.projects.length;i++) if(SITE.projects[i].id===id) return SITE.projects[i];
    return null;
  }
  function kindLabel(kind){
    var map={work:["Work","作品"],drawing:["Drawing","绘画"],image:["Image","图像"],publication:["Publication","出版"],text:["Text","文本"],object:["Object","物件"],video:["Video","影像"]};
    var m=map[kind]||["Fragment","碎片"];
    return bi(m[0],m[1]);
  }

  var secById={};
  SITE.sections.forEach(function(s){secById[s.id]=s;});

  var wrap=document.getElementById("sectionsWrap");

  /* WORK */
  (function(){
    var sec=secById.work;
    var html=bodies().map(function(p,i){
      var pi=SITE.projects.indexOf(p);
      var plate=!p.img;
      var cls="body-work"+(i%2?" flip":"")+(plate?" plate":"");
      var img=plate?"":'<div class="bw-img">'+media(p.img)+"</div>";
      return '<article class="'+cls+'" onclick="openP('+pi+')">'+img+
        '<div class="bw-copy">'+
          '<p class="bw-meta">'+esc(p.year)+(p.mediumEn?" · "+bi(p.mediumEn,p.mediumZh||p.mediumEn):"")+(p.placeEn?" · "+bi(p.placeEn,p.placeZh||""):"")+"</p>"+
          '<h3 class="bw-title">'+bi(p.titleEn,p.titleZh)+"</h3>"+
          '<p class="bw-sub">'+bi(p.subtitleEn,p.subtitleZh)+"</p>"+
          '<p class="bw-intro">'+bi(p.introEn,p.introZh)+"</p>"+
          '<span class="bw-open">'+bi("Open the work","打开作品")+"</span>"+
        "</div></article>";
    }).join("");
    var el=document.createElement("section");
    el.className="panel"; el.id="p-work"; el.dataset.id="work";
    el.innerHTML='<div class="work-head"><p class="wh-k">'+bi("Work","作品")+"</p>"+
      '<h2 class="wh-title">'+bih(sec.titleEnHtml,sec.titleZhHtml)+"</h2>"+
      '<p class="wh-intro">'+bi(sec.introEn,sec.introZh)+"</p></div>"+
      '<div class="bodies">'+html+"</div>";
    wrap.appendChild(el);
  })();

  /* FRAGMENTS */
  var fragFilter="all", fragOpen=-1;
  (function(){
    var sec=secById.frag;
    var filters=(SITE.fragFilters||[]).map(function(f){
      return '<button class="ff'+(f.id==="all"?" on":"")+'" type="button" data-kind="'+esc(f.id)+'" onclick="filterFrag(\''+f.id+'\')">'+bi(f.labelEn,f.labelZh)+"</button>";
    }).join("");
    var list=SITE.fragments||[];
    var html=list.map(function(t,i){
      var extra="";
      if(i===5||i===15||i===22) extra=" ov";
      if(i===8||i===18) extra+=" nudge";
      var body=t.kind==="text"||t.textEn
        ? '<div class="frag-plate">'+bi(t.textEn||t.titleEn,t.textZh||t.titleZh)+"</div>"
        : '<img src="'+esc(t.src)+'" alt=""/>';
      var rel=relatedProject(t.related);
      return '<button class="frag '+(t.size||"m")+extra+'" type="button" data-kind="'+esc(t.kind||"image")+'" style="--r:'+(t.r||0)+'deg" onclick="openFrag('+i+')">'+
        body+
        '<span class="frag-meta"><span class="frag-kind">'+kindLabel(t.kind)+"</span>"+
        bi(t.titleEn,t.titleZh)+"<br/>"+esc(t.year||"")+(t.mediumEn?" · "+bi(t.mediumEn,t.mediumZh||""):"")+
        (rel?"<br/>"+bi(rel.titleEn,rel.titleZh):"")+"</span></button>";
    }).join("");
    var el=document.createElement("section");
    el.className="panel"; el.id="p-frag"; el.dataset.id="frag";
    el.innerHTML='<div class="work-head"><p class="wh-k">'+bi("Visual Notes","视觉笔记")+"</p>"+
      '<h2 class="wh-title">'+bih(sec.titleEnHtml,sec.titleZhHtml)+"</h2>"+
      '<p class="wh-intro">'+bi(sec.introEn,sec.introZh)+"</p></div>"+
      '<div class="frag-filters" id="frag-filters">'+filters+"</div>"+
      '<div class="frag-field" id="frag-field">'+html+"</div>";
    wrap.appendChild(el);
  })();

  /* ARCHIVE */
  (function(){
    var sec=secById.arch;
    var rows=SITE.projects.map(function(p,i){
      var kind=p.group==="design"?"Design":(p.group==="fragment"?"Note":"Work");
      var kindZh=p.group==="design"?"设计":(p.group==="fragment"?"笔记":"作品");
      return '<button class="led-row" type="button" onclick="openP('+i+')">'+
        "<span>"+esc(p.year||"—")+"</span>"+
        '<span class="led-title">'+bi(p.titleEn,p.titleZh)+"</span>"+
        "<span>"+bi(p.mediumEn||p.subtitleEn,p.mediumZh||p.subtitleZh)+"</span>"+
        "<span>"+bi(kind,kindZh)+"</span>"+
        "<span>"+esc(p.id||"")+"</span></button>";
    }).join("");
    var el=document.createElement("section");
    el.className="panel"; el.id="p-arch"; el.dataset.id="arch";
    el.innerHTML='<div class="work-head"><p class="wh-k">'+bi("Archive","档案")+"</p>"+
      '<h2 class="wh-title">'+bih(sec.titleEnHtml,sec.titleZhHtml)+"</h2>"+
      '<p class="wh-intro">'+bi(sec.introEn,sec.introZh)+"</p></div>"+
      '<div class="ledger"><div class="led-head led-row" style="pointer-events:none">'+
        "<span>"+bi("Year","年份")+"</span><span>"+bi("Title","标题")+"</span><span>"+bi("Medium","媒介")+"</span><span>"+bi("Kind","类型")+"</span><span>ID</span></div>"+rows+"</div>";
    wrap.appendChild(el);
  })();

  /* DESIGN */
  (function(){
    var sec=secById.design;
    var html=designWorks().map(function(p){
      var pi=SITE.projects.indexOf(p);
      return '<button class="ditem" type="button" onclick="openP('+pi+')">'+
        '<div class="dthumb">'+media(p.img)+"</div>"+
        '<div><div class="dtitle">'+bi(p.titleEn,p.titleZh)+'</div><div class="dsub">'+bi(p.subtitleEn,p.subtitleZh)+"</div></div>"+
        '<span class="dyr">'+esc(p.year)+"</span></button>";
    }).join("");
    var el=document.createElement("section");
    el.className="panel"; el.id="p-design"; el.dataset.id="design";
    el.innerHTML='<div class="work-head"><p class="wh-k">'+bi("Design","设计")+"</p>"+
      '<h2 class="wh-title">'+bih(sec.titleEnHtml,sec.titleZhHtml)+"</h2>"+
      '<p class="wh-intro">'+bi(sec.introEn,sec.introZh)+"</p></div>"+
      '<div class="design-list">'+html+"</div>";
    wrap.appendChild(el);
  })();

  /* ABOUT */
  var a=SITE.about;
  document.getElementById("aboutWrap").innerHTML=
    '<div class="about-top">'+
      '<div class="aport"><img src="'+esc(a.photo)+'" alt=""/></div>'+
      '<div><h2 class="aname">'+bi(a.nameEn,a.nameZh)+"</h2>"+
      '<p class="arole">'+bi(a.roleEn,a.roleZh)+"</p>"+
      '<div class="abio">'+a.bioEn.map(function(p,i){return "<p>"+bi(p,a.bioZh[i]||"")+"</p>";}).join("")+"</div></div></div>"+
    '<div class="contact-block">'+
      '<h3 class="chead">'+bih(a.contactHeadEnHtml,a.contactHeadZhHtml)+"</h3>"+
      "<ul class=\"clist\">"+a.servicesEn.map(function(s,i){return "<li>"+bi(s,a.servicesZh[i]||"")+"</li>";}).join("")+"</ul>"+
      '<a href="mailto:'+esc(a.email)+'" class="ebtn"><span>'+bi(a.emailBtnEn,a.emailBtnZh)+"</span></a>"+
      '<p class="abio" style="margin-top:20px">'+bi(a.availabilityEn,a.availabilityZh)+"</p></div>"+
    '<div class="cvl"><span class="e">Notes</span><span class="h">记录</span></div><div class="cvg"><div>'+
      a.experience.map(function(e){return '<div class="cvi"><div class="cvyr">'+e.years+"</div><div class=\"cvti\">"+bi(e.titleEn,e.titleZh)+"</div>"+(e.subtitleEn?'<div class="cvsu">'+bi(e.subtitleEn,e.subtitleZh)+"</div>":"")+'<div class="cvbo">'+bi(e.bodyEn,e.bodyZh)+"</div></div>";}).join("")+
    '</div><div><div class="cvi"><div class="cvyr">'+bi(a.education.yearsLabelEn,a.education.yearsLabelZh)+"</div>"+
      '<div class="cvti">'+bi(a.education.titleEn,a.education.titleZh)+"</div>"+
      '<div class="cvsu">'+bi(a.education.schoolEn,a.education.schoolZh)+"</div></div></div></div>"+
    '<div class="cvl"><span class="e">Tools &amp; languages of making</span><span class="h">工具</span></div>'+
    '<div class="skg">'+a.skillsEn.map(function(s,i){return '<div class="sk">'+bi(s,a.skillsZh[i]||"")+"</div>";}).join("")+"</div>"+
    '<div class="cvl"><span class="e">Languages</span><span class="h">语言</span></div>'+
    "<div>"+a.languages.map(function(l){return '<div class="lgi"><div class="lgrow"><span>'+l.name+"</span><span>"+bi(l.levelEn,l.levelZh||"")+"</span></div><div class=\"lgbar\"><div class=\"lgfi\" data-w=\""+l.width+"\"></div></div></div>";}).join("")+"</div>";

  /* SPY */
  var panels=document.querySelectorAll(".panel");
  var navBtns=document.querySelectorAll(".nl");
  var spy=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        var id=en.target.dataset.id;
        navBtns.forEach(function(b){b.classList.toggle("act",b.getAttribute("href")==="#p-"+id);});
        if(id==="about"&&!lgDone){
          lgDone=true;
          document.querySelectorAll(".lgfi").forEach(function(f){
            f.style.width=(parseFloat(f.getAttribute("data-w"))*100)+"%";
          });
        }
      }
    });
  },{rootMargin:"-40% 0px -40% 0px",threshold:0});
  panels.forEach(function(p){spy.observe(p);});

  window.tgl=function(){
    document.body.classList.toggle("zh");
    document.getElementById("llbl").textContent=zhNow()?"EN":"中文";
    if(curPop>=0) fillFolio(curPop);
    if(fragOpen>=0) fillSlip(fragOpen);
  };

  window.zoomImg=function(src){
    document.getElementById("zoomimg").src=src;
    document.getElementById("zoom").classList.add("on");
  };

  window.filterFrag=function(kind){
    fragFilter=kind;
    document.querySelectorAll("#frag-filters .ff").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-kind")===kind);
    });
    document.querySelectorAll("#frag-field .frag").forEach(function(el){
      var show=kind==="all"||el.getAttribute("data-kind")===kind;
      el.classList.toggle("is-out", !show);
    });
  };

  function fillSlip(i){
    var list=SITE.fragments||[];
    var t=list[i]; if(!t) return;
    var rel=relatedProject(t.related);
    var vis=list.map(function(x,n){return n;}).filter(function(n){
      if(fragFilter==="all") return true;
      return (list[n].kind||"image")===fragFilter;
    });
    var pos=vis.indexOf(i);
    var prev=pos>0?vis[pos-1]:-1;
    var next=pos>=0&&pos<vis.length-1?vis[pos+1]:-1;
    var fig=(t.kind==="text"||t.textEn)
      ? '<div class="slip-plate">'+bi(t.textEn||t.titleEn,t.textZh||t.titleZh)+"</div>"
      : '<figure class="slip-fig"><img src="'+esc(t.src)+'" alt=""/></figure>';
    var relBtn=rel?'<button class="slip-rel" type="button" onclick="closeFrag();openP('+SITE.projects.indexOf(rel)+')">'+bi("Related work — "+rel.titleEn,"相关作品 — "+rel.titleZh)+"</button>":"";
    document.getElementById("slip-body").innerHTML=
      fig+
      '<aside class="slip-side">'+
        '<p class="slip-k">'+kindLabel(t.kind)+"</p>"+
        '<h2 class="slip-title">'+bi(t.titleEn,t.titleZh)+"</h2>"+
        '<p class="slip-facts">'+esc(t.year||"")+(t.mediumEn?" · "+bi(t.mediumEn,t.mediumZh||""):"")+
        (rel?"<br/>"+bi(rel.titleEn,rel.titleZh):"")+"</p>"+
        relBtn+
        '<div class="slip-nav">'+
          (prev>=0?'<button type="button" onclick="openFrag('+prev+')">'+bi("Previous","上一条")+"</button>":"<span></span>")+
          (next>=0?'<button type="button" onclick="openFrag('+next+')">'+bi("Next","下一条")+"</button>":"")+
        "</div></aside>";
  }

  window.openFrag=function(i){
    fragOpen=i;
    fillSlip(i);
    document.getElementById("slip").classList.add("on");
    document.getElementById("slip").setAttribute("aria-hidden","false");
    document.getElementById("slip").scrollTop=0;
  };
  window.closeFrag=function(){
    document.getElementById("slip").classList.remove("on");
    document.getElementById("slip").setAttribute("aria-hidden","true");
    fragOpen=-1;
  };

  function fillFolio(i){
    var p=SITE.projects[i], z=zhNow();
    var layout=p.layout||"folio";
    document.getElementById("folio-k").innerHTML=bi(p.titleEn,p.titleZh);
    var facts=[];
    if(p.year) facts.push(p.year);
    facts.push(z?(p.mediumZh||p.roleZh):(p.mediumEn||p.roleEn));
    if(p.placeEn) facts.push(z?p.placeZh:p.placeEn);
    var seqClass="seq"+(layout==="spread"?" spread":layout==="strip"||layout==="folio"?" vary":"");
      var imgs=(p.images||[]).map(function(src,n){
      return media(src,"media",true)+'<p class="cap">'+(n+1).toString().padStart(2,"0")+"</p>";
    }).join("");
    var cover=p.img?media(p.img,"media",true):'<div class="blank-plate">'+bi(p.introEn,p.introZh)+"</div>";
    var site=p.website?'<a class="site-link" href="'+esc(p.website)+'" target="_blank" rel="noopener">'+bi("Open the site ↗","打开网站 ↗")+"</a>":"";
    var inner=
      '<p class="folio-k">'+facts.map(function(f){return "<span>"+esc(f)+"</span>";}).join(" · ")+"</p>"+
      '<h2 class="folio-title">'+bi(p.titleEn,p.titleZh)+"</h2>"+
      '<p class="folio-sub">'+bi(p.subtitleEn,p.subtitleZh)+"</p>"+site+
      (layout==="compact"?cover:'')+
      '<p class="ppin">'+esc(z?p.introZh:p.introEn)+"</p>"+
      '<p class="ppde">'+esc(z?p.descZh:p.descEn)+"</p>"+
      (layout!=="compact"?cover:"")+
      '<div class="'+seqClass+'">'+imgs+"</div>"+
      '<p class="ppcr">'+esc(z?p.creditsZh:p.creditsEn)+"</p>";
    var box=document.getElementById("folio-inner");
    var folio=document.getElementById("folio");
    folio.className="folio on layout-"+layout;
    box.innerHTML=inner;
  }

  window.openP=function(i){
    curPop=i;
    fillFolio(i);
    document.getElementById("pov").classList.add("on");
    document.getElementById("folio").classList.add("on");
    document.getElementById("folio").setAttribute("aria-hidden","false");
    document.getElementById("folio").scrollTop=0;
  };
  window.cpop=function(){
    document.getElementById("pov").classList.remove("on");
    document.getElementById("folio").classList.remove("on");
    document.getElementById("folio").setAttribute("aria-hidden","true");
    curPop=-1;
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){
      document.getElementById("zoom").classList.remove("on");
      closeFrag();
      cpop();
    }
  });
})();
</script>
</body>
</html>
