<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Yihui Zhu — Author Designer</title>
<link rel="icon" href="yihuizhu-portfolio/assets/images/favicon/yihui-favicon.svg" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400&display=Noto+Serif+SC:wght@300;400&family=swap"rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EEEBE4;--paper:#F7F5F0;--ink:#141414;--mid:#4A4845;--mute:#7A7570;--line:#dad8d5;
  --acc:#009797;--acc-dim:rgba(0,151,151,.12);;
  --ser:"Instrument Serif",Georgia,serif;--mono:"IBM Plex Mono",monospace;
  --nav:180px;--ease:cubic-bezier(.22,1,.36,1)
}
html{height:100%;scroll-snap-type:y mandatory;scroll-behavior:smooth}
body{height:100%;overflow:visible;background:var(--bg);color:var(--ink);font-family:var(--mono);font-weight:300;font-size:13px;line-height:1.65;letter-spacing:normal;display:flex;cursor:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9000;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:160px}
.h{display:none}body.zh .e{display:none}body.zh .h{display:inline}body.zh .h.blk{display:block}
body.zh .ser-tx{font-family:"Noto Serif SC",serif;font-size:.96em;letter-spacing:.02em}
#cur{position:fixed;width:4px;height:4px;background:var(--acc);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .12s}
#crn{position:fixed;width:22px;height:22px;border:1px solid var(--acc);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);opacity:.28;transition:width .3s,height .3s,opacity .3s}
.hov #cur{transform:translate(-50%,-50%) scale(2.2);background:transparent;opacity:.55}
.hov #crn{width:36px;height:36px;opacity:.1}

/* NAV */
#nav{position:fixed;top:0;left:0;bottom:0;width:var(--nav);background:var(--paper);border-right:1px solid var(--line);z-index:200;display:flex;flex-direction:column;padding:22px 20px 20px}
.nlogo{display:block;margin-bottom:28px;text-decoration:none;flex-shrink:0}
.nlogo img{height:66px;width:auto;display:block;transition:opacity .25s}
.nlogo:hover img{opacity:.45}
.nlist{list-style:none;display:flex;flex-direction:column;gap:2px;flex:1}
.nl{display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--mid);text-decoration:none;padding:7px 0;border:none;background:none;cursor:none;text-align:left;width:100%;transition:color .2s,font-weight .2s}
.nl-num{font-size:9px;color:var(--mute);min-width:16px;transition:color .2s}
.nl:hover{color:var(--acc)}
.nl.act{color:var(--acc);font-weight:400}
.nl.act .nl-num{color:var(--acc)}
.nsep{height:1px;background:var(--line);margin:12px 0}
.nfoot{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.lbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:6px 10px;font-family:var(--mono);font-size:10px;color:var(--mute);cursor:none;background:none;transition:border-color .2s,color .2s}
.lbtn:hover{border-color:var(--acc);color:var(--acc)}
.ldot{width:4px;height:4px;border-radius:50%;background:var(--acc);opacity:.45}
.ncopy{font-size:10px;color:var(--mute);line-height:1.6}

/* STAGE */
#stage{margin-left:var(--nav);width:calc(100% - var(--nav));position:relative}

/* PANELS */
.panel{scroll-snap-align:start;min-height:100vh;background:var(--paper)}

/* HOME */
.home-grid{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.home-copy{flex:1;display:flex;flex-direction:column;justify-content:center;padding:64px 44px 64px 52px}
.home-ey{font-size:11px;color:var(--acc);margin-bottom:18px}
.home-name{font-family:var(--ser);font-size:clamp(42px,5.2vw,76px);font-weight:100;line-height:.90;margin-bottom:14px;letter-spacing:-.01em}
body.zh .home-name{font-family:"LXGW WenKai Web":var(--ser);font-size:clamp(38px,5.2vw,70px);font-weight:200}
.home-name em{font-style:italic;color:var(--acc)}
.home-role{font-size:11px;color:var(--mid);margin-bottom:20px;font-weight:300;letter-spacing:.04em}
.home-def{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px}
.def-word{font-family:var(--ser);font-size:15px;font-style:italic;color:var(--ink);margin-bottom:4px;letter-spacing:.04em;word-spacing:.07em}
.def-pron{font-size:10px;color:var(--mute);margin-bottom:6px}
.def-body{font-size:12px;line-height:1.85;color:var(--mute);max-width:340px;font-weight:300;letter-spacing:.01em}
.home-bio{font-family:var(--ser);font-size:15px;font-style:italic;line-height:1.85;color:var(--mid);max-width:360px;font-weight:300;letter-spacing:.04em;word-spacing:.07em}
body.zh .home-bio{font-family:"LXGW WenKai Web",serif;font-style:normal;font-size:13px;font-weight:300;letter-spacing:.01em}
.home-meta{margin-top:22px;display:flex;align-items:center;gap:12px;font-size:11px;color:var(--mute)}
.home-meta span{width:28px;height:1px;background:var(--line)}
.home-visual{position:relative;display:flex;align-items:center;justify-content:center;padding:40px;background:var(--bg)}
.home-frame{width:min(420px,78%);aspect-ratio:4/5;position:relative;border:1px solid var(--line);background:var(--acc-dim,rgba(0,151,151,.12));overflow:hidden}
.home-frame img{width:100%;height:100%;object-fit:cover;display:block}
.home-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.home-ph span{font-size:8px;letter-spacing:normal;text-transform:uppercase;color:var(--line)}
.home-ph svg{opacity:.2;color:var(--acc)}
.home-index{position:absolute;bottom:28px;right:32px;font-family:var(--ser);font-size:clamp(80px,10vw,140px);font-style:italic;color:transparent;-webkit-text-stroke:1px rgba(0,151,151,.14);line-height:1;pointer-events:none;user-select:none}
.home-tags{position:absolute;top:28px;left:32px;display:flex;flex-direction:column;gap:6px}
.home-tag{font-size:44px;letter-spacing:.1em;color:var(--paper)}

/* WORK SECTIONS */
.work-head{padding:36px 44px 28px;border-bottom:1px solid var(--line)}
.wh-title{font-family:var(--ser);font-size:clamp(28px,3.4vw,44px);font-weight:200;line-height:1.05;margin-bottom:10px;letter-spacing:normal}
.wh-title em{font-style:italic;color:var(--acc)}
.wh-intro{font-family:var(--ser);font-size:14px;font-style:italic;line-height:1.8;color:var(--mid);max-width:520px;margin-top:12px;letter-spacing:.04em;word-spacing:.09em}
body.zh .wh-intro{font-family:"LXGW WenKai Web",serif;font-style:normal;font-size:13px}
.wh-count{font-size:11px;color:var(--mute);margin-top:10px}
.work-list{padding:0 44px 36px;display:flex;flex-direction:column}
.witem{display:grid;grid-template-columns:36px 120px 1fr auto;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);cursor:none;transition:background .25s,padding-left .25s}
.witem:first-child{border-top:1px solid var(--line)}
.witem:hover{background:rgba(0,151,151,.04);padding-left:8px}
.witem-num{font-size:10px;color:var(--mute)}
.wthumb{width:120px;height:88px;border:1px solid var(--line);overflow:hidden;position:relative;flex-shrink:0;display:block}
.wthumb img,.wthumb video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.witem:hover .wthumb img,.witem:hover .wthumb video{transform:scale(1.04)}
.wph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:10px;color:var(--mute);background:var(--paper)}
.wthumb-link{display:block;width:120px;height:88px;overflow:hidden;border:1px solid var(--line);position:relative;flex-shrink:0;transition:border-color .25s}
.wthumb-link img,.wthumb-link video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.wthumb-link:hover{border-color:var(--acc)}
.wthumb-link:hover img,.wthumb-link:hover video{transform:scale(1.04)}
.wthumb-visit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;background:rgba(0,151,151,.08);transition:opacity .25s;font-size:9px;color:var(--acc);letter-spacing:.06em;pointer-events:none}
.wthumb-link:hover .wthumb-visit{opacity:1}
.winfo{display:flex;flex-direction:column;gap:4px;min-width:0}
.wtit{font-family:var(--ser);font-size:clamp(12px,1.6vw,21px);font-weight:300;line-height:1.15;color:var(--ink);transition:color .2s;letter-spacing:.02em;word-spacing:.07em}
.witem:hover .wtit{color:var(--acc)}
.wsub{font-size:11px;color:var(--mid);line-height:1.6}
.wtags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.wtag{font-size:10px;color:var(--mute);border:1px solid var(--line);padding:2px 7px;background:var(--paper)}
.warr{font-size:14px;color:var(--line);transition:color .2s,transform .2s}
.witem:hover .warr{color:var(--acc);transform:translateX(4px)}

/* ABOUT */
.about-wrap{padding:44px 44px 56px;max-width:880px}
.about-top{display:grid;grid-template-columns:144px 1fr;gap:32px;margin-bottom:40px;padding-bottom:36px;border-bottom:1px solid var(--line)}
.aport{width:144px;height:180px;border:1px solid var(--line);overflow:hidden;position:relative;flex-shrink:0;background:var(--paper)}
.aport img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.aport-ph{display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:absolute;inset:0;background:var(--paper)}
.aport-ph svg{opacity:.18;color:var(--acc)}
.aport-ph span{font-size:10px;color:var(--mute)}
.abio-top{display:flex;flex-direction:column;justify-content:center}
.aname{font-family:var(--ser);font-size:26px;font-weight:200;margin-bottom:6px;line-height:1.1}
.arole{font-size:11px;color:var(--acc);margin-bottom:16px}
.abio{font-size:13px;line-height:1.85;color:var(--mid);max-width:480px}
.abio p{margin-bottom:12px}
.abio p:last-child{margin-bottom:0}
.contact-block{margin-bottom:40px;padding-bottom:36px;border-bottom:1px solid var(--line)}
.chead{font-family:var(--ser);font-size:clamp(22px,2.6vw,32px);font-weight:300;line-height:1.15;margin-bottom:16px;letter-spacing:normal}
.chead em{font-style:italic;color:var(--acc)}
.clist{list-style:none;font-size:13px;color:var(--mid);line-height:2.2}
.clist li{padding-left:16px;position:relative}
.clist li::before{content:"—";position:absolute;left:0;color:var(--acc);font-size:11px}
.ebtn{display:inline-flex;align-items:center;gap:9px;margin-top:20px;background:var(--ink);color:var(--paper);text-decoration:none;padding:11px 20px;font-family:var(--mono);font-size:11px;cursor:none;transition:background .25s,gap .25s;letter-spacing:normal;text-transform:uppercase}
.ebtn:hover{background:var(--acc);gap:13px}
.ebtn svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.5}
.cvl{font-size:11px;color:var(--acc);margin-bottom:20px;display:flex;align-items:center;gap:12px;text-transform:uppercase}
.cvl::after{content:"";flex:1;height:1px;background:var(--line)}
.cvg{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-bottom:40px}
.cvi{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.cvi:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.cvyr{font-size:11px;color:var(--acc);margin-bottom:6px}
.cvti{font-family:var(--ser);font-size:17px;margin-bottom:4px;line-height:1.2}
.cvsu{font-size:12px;color:var(--mid);margin-bottom:6px;line-height:1.6}
.cvbo{font-size:12px;color:var(--mute);line-height:1.85}
.skg{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:36px}
.sk{padding:10px 12px;background:var(--paper);font-size:12px;color:var(--ink);transition:background .2s;line-height:1.5}
.sk:hover{background:rgba(0,151,151,.08)}
.lgi{margin-bottom:12px}
.lgrow{display:flex;justify-content:space-between;margin-bottom:5px}
.lgnm{font-size:12px}
.lglv{font-size:11px;color:var(--acc);text-transform:uppercase}
.lgbar{height:1px;background:var(--line);position:relative}
.lgfi{position:absolute;left:0;top:0;bottom:0;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease)}

/* POPUP */
.pov{position:fixed;inset:0;z-index:500;background:rgba(20,20,20,0);pointer-events:none;transition:background .4s}
.pov.on{background:rgba(20,20,20,.48);pointer-events:all}
.pp{position:fixed;top:0;right:0;bottom:0;width:min(720px,94vw);background:var(--paper);z-index:501;transform:translateX(100%);transition:transform .5s var(--ease);overflow-y:auto}
.pp.on{transform:translateX(0)}
.pptop{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:rgba(247,245,240,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.pplabel{font-size:11px;color:var(--acc)}
.pplabel a{color:var(--acc);text-decoration:none;margin-left:10px;font-size:10px;letter-spacing:normal}
.pplabel a:hover{text-decoration:underline}
.ppx{background:none;border:1px solid var(--line);width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mid);cursor:none;transition:border-color .2s,color .2s}
.ppx:hover{border-color:var(--acc);color:var(--acc)}
.pphi{width:100%;overflow:hidden;border-bottom:1px solid var(--line);position:relative}
.pphi-link{display:block;cursor:pointer;transition:opacity .25s}
.pphi-link:hover{opacity:.88}
.pphi img,.pphi video{width:100%;height:auto;display:block}
.pphi-site-btn{position:absolute;bottom:16px;right:16px;display:inline-flex;align-items:center;gap:6px;background:rgba(247,245,240,.92);border:1px solid var(--line);color:var(--ink);text-decoration:none;padding:7px 14px;font-family:var(--mono);font-size:10px;cursor:none;backdrop-filter:blur(6px);transition:background .2s,border-color .2s,color .2s;letter-spacing:.04em;z-index:2}
.pphi-site-btn:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.pphi-site-btn svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:1.5}
.pphiph{width:100%;min-height:200px;display:flex;align-items:center;justify-content:center;background:var(--paper);border-bottom:1px solid var(--line)}
.pphiph span{font-size:11px;color:var(--mute)}
.ppbd{padding:28px 28px 48px}
.ppmt{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ppyr{font-size:11px;color:var(--acc)}
.pprl{font-size:11px;color:var(--mute);text-transform:uppercase}
.ppti{font-family:var(--ser);font-size:clamp(20px,2.6vw,30px);line-height:1.12;margin-bottom:6px;letter-spacing:.04em;word-spacing:.07em}
.ppsu{font-family:var(--ser);font-size:13px;font-style:italic;color:var(--mid);margin-bottom:12px;line-height:1.65;letter-spacing:.04em;word-spacing:.07em}
body.zh .ppsu{font-family:"LXGW WenKai Web",serif;font-style:normal}
.pptgs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px}
.pptg{font-size:11px;color:var(--mute);border:1px solid var(--line);padding:3px 8px}
.ppin{font-family:var(--ser);font-size:14px;font-style:italic;line-height:1.8;color:var(--mid);border-left:2px solid var(--acc);padding-left:16px;margin-bottom:18px;letter-spacing:.04em;word-spacing:.07em}
body.zh .ppin{font-family:"LXGW WenKai Web",serif;font-style:normal;line-height:1.85}
.ppde{font-size:13px;line-height:1.85;color:var(--mid);margin-bottom:24px;max-width:520px}
.ppil{font-size:11px;color:var(--acc);margin-bottom:12px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
.ppil::after{content:"";flex:1;height:1px;background:var(--line)}
.ppig{display:flex;flex-direction:column;gap:10px}
.ppiw img,.ppiw video{width:100%;height:auto;display:block;border:1px solid var(--line)}
.ppiph{width:100%;min-height:100px;display:flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line)}
.ppiph span{font-size:11px;color:var(--mute)}
.ppcr{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--mid);line-height:2.1}

@media(max-width:960px){
  :root{--nav:0px}
  html{scroll-snap-type:none}
  body{overflow:auto;height:auto;cursor:auto}
  #nav{position:fixed;top:0;left:0;right:0;bottom:auto;width:100%;height:auto;flex-direction:row;align-items:center;padding:10px 14px;gap:8px;overflow-x:auto}
  .nlogo{margin-bottom:0;flex-shrink:0}
  .nlogo img{height:44px}
  .nlist{flex-direction:row;flex:1;gap:0;overflow-x:auto}
  .nsep,.ncopy{display:none}
  .nfoot{flex-direction:row;align-items:center;margin-top:0;flex-shrink:0}
  #stage{margin-left:0;width:100%}
  .panel{min-height:calc(100vh - 56px)}
  .home-grid{grid-template-columns:1fr;min-height:calc(100vh - 56px)}
  .home-photo{height:240px;border-left:none;border-top:1px solid var(--line)}
  .home-copy{justify-content:flex-start;padding:36px 20px}
  .witem{grid-template-columns:28px 88px 1fr auto;gap:14px}
  .wthumb,.wthumb-link{width:88px;height:60px}
  .work-head,.work-list,.about-wrap{padding-left:20px;padding-right:20px}
  .about-top,.cvg{grid-template-columns:1fr}
  .skg{grid-template-columns:1fr 1fr}
  #cur,#crn{display:none}
  .pp{width:100vw}
}
@media(max-width:560px){
  .witem{grid-template-columns:1fr;gap:8px}
  .wthumb,.wthumb-link{width:100%;height:120px}
  .skg{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<div id="cur"></div>
<div id="crn"></div>
<div class="pov" id="pov" onclick="cpop()"></div>
<div class="pp" id="pp">
  <div class="pptop">
    <span class="pplabel" id="pplabel"></span>
    <button class="ppx" onclick="cpop()">&#215;</button>
  </div>
  <div class="pphi" id="pphi"></div>
  <div class="ppbd">
    <div class="ppmt"><span class="ppyr" id="ppyr"></span><span class="pprl" id="pprl"></span></div>
    <div class="ppti" id="ppti"></div>
    <div class="ppsu" id="ppsu"></div>
    <div class="pptgs" id="pptgs"></div>
    <div class="ppin" id="ppin"></div>
    <div class="ppde" id="ppde"></div>
    <div class="ppil" id="ppil">Project Images</div>
    <div class="ppig" id="ppig"></div>
    <div class="ppcr" id="ppcr"></div>
  </div>
</div>

<nav id="nav">
  <a href="#p-home" class="nlogo"><img src="yihuizhu-portfolio/assets/images/homepage/yihui-logo.svg" alt="Yihui Zhu"/></a>
  <ul class="nlist" id="navList"></ul>
  <div class="nfoot">
    <button class="lbtn" id="lbtn" onclick="tgl()"><span class="ldot"></span><span id="llbl">中文</span></button>
    <span class="ncopy">&#169; 2026 Yihui Zhu</span>
  </div>
</nav>

<main id="stage">
  <section class="panel" id="p-home" data-id="home">
    <div class="home-grid">
      <div class="home-copy">
        <p class="home-ey" id="home-ey"></p>
        <h1 class="home-name" id="home-name"></h1>
        <p class="home-role" id="home-role"></p>
        <div class="home-def">
          <p class="def-word">author-designer</p>
          <p class="def-pron">/au&#183;thor de&#183;sign&#183;er/</p>
          <p class="def-body ser-tx" id="home-def"></p>
        </div>
        <p class="home-bio ser-tx" id="home-bio"></p>
        <div class="home-meta"><span></span><span id="home-loc"></span></div>
      </div>
      <div class="home-visual">
        <div class="home-tags">
          <span class="home-tag" id="home-tag-design"></span>
          <span class="home-tag" id="home-tag-narrative"></span>
          <span class="home-tag" id="home-tag-systems"></span>
        </div>
        <div class="home-frame">
          <img id="home-photo-img" src="yihuizhu-portfolio/assets/images/about/yihui-profile.png" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
          <div class="home-ph" id="home-fph-placeholder">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <span>Hero visual</span>
          </div>
        </div>
        <span class="home-index">YZ</span>
      </div>
    </div>
  </section>
  <div id="sectionsWrap"></div>
  <section class="panel" id="p-about" data-id="about">
    <div class="about-wrap" id="aboutWrap"></div>
  </section>
</main>

<script src="site-content.js"></script>
<script>
(function(){
  var CC=document.getElementById("cur"),CR=document.getElementById("crn"),mx=0,my=0,rx=0,ry=0;
  var curPop=-1,lgDone=false;

  function bi(en,zh){return '<span class="e">'+en+'</span><span class="h">'+zh+'</span>';}
  function bih(en,zh){return '<span class="e">'+en+'</span><span class="h blk">'+zh+'</span>';}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
  /* NAV */
  var navNums={home:"&#8212;",sys:"01",vis:"02",nar:"03",about:"&#8212;"};
  var navList=document.getElementById("navList");
  SITE.nav.forEach(function(n,i){
    if(n.id==="about"){var sep=document.createElement("div");sep.className="nsep";navList.appendChild(sep);}
    var li=document.createElement("li");
    li.innerHTML='<a class="nl'+(i===0?' act':'')+'" href="#p-'+n.id+'"><span class="nl-num">'+navNums[n.id]+'</span>'+bi(n.labelEn,n.labelZh)+'</a>';
    navList.appendChild(li);
  });

  /* HOME TEXT */
  var h=SITE.home;
  document.getElementById("home-ey").innerHTML=bi(h.eyebrowEn,h.eyebrowZh);
  document.getElementById("home-name").innerHTML=bih(h.nameEnHtml,h.nameZhHtml);
  document.getElementById("home-role").innerHTML=bi(h.roleEn,h.roleZh);
  document.getElementById("home-def").innerHTML=bi(h.defEn,h.defZh);
  document.getElementById("home-bio").innerHTML=bi(h.bioEn,h.bioZh);
  document.getElementById("home-loc").innerHTML=bi(h.locationEn,h.locationZh);
  document.getElementById("home-tag-design").innerHTML='<span class="e">Design</span><span class="h">设计</span>';
  document.getElementById("home-tag-narrative").innerHTML='<span class="e">Narrative</span><span class="h">叙事</span>';
  document.getElementById("home-tag-systems").innerHTML='<span class="e">Systems</span><span class="h">系统</span>';

  /* SECTIONS */
  var wrap=document.getElementById("sectionsWrap");
  var catIdx={sys:1,vis:1,nar:1};
  SITE.sections.forEach(function(sec){
    var projs=SITE.projects.filter(function(p){return p.cat===sec.id;});
    var rows=projs.map(function(p){
      var idx=SITE.projects.indexOf(p);
      var n=String(catIdx[sec.id]++).padStart(2,"0");
      var ext=p.img.split(".").pop().toLowerCase();
      var media=(ext==="gif"||ext==="png"||ext==="jpg"||ext==="jpeg"||ext==="webp")
        ?'<img src="'+esc(p.img)+'" alt=""/>'
        :'<video src="'+esc(p.img)+'" autoplay loop muted playsinline></video>';
      var thumb='<div class="wthumb">'+media+'<div class="wph">Visual</div></div>';
      return '<article class="witem" onclick="openP('+idx+')">'+
        '<span class="witem-num">'+n+'</span>'+thumb+
        '<div class="winfo">'+
          '<h3 class="wtit">'+bi(p.titleEn,p.titleZh)+'</h3>'+
          '<p class="wsub">'+bi(p.subtitleEn,p.subtitleZh)+'</p>'+
          '<div class="wtags">'+p.tagsEn.map(function(t,i){return'<span class="wtag">'+bi(t,p.tagsZh[i]||t)+'</span>';}).join("")+'</div>'+
        '</div><span class="warr">&#8594;</span></article>';
    }).join("");
    var el=document.createElement("section");
    el.className="panel";
    el.id="p-"+sec.id;
    el.dataset.id=sec.id;
    el.innerHTML=
      '<div class="work-head">'+
        '<h2 class="wh-title">'+bih(sec.titleEnHtml,sec.titleZhHtml)+'</h2>'+
        '<p class="wh-intro">'+bi(sec.introEn,sec.introZh)+'</p>'+
        '<p class="wh-count">'+projs.length+' project'+(projs.length>1?'s':'')+'</p>'+
      '</div>'+
      '<div class="work-list">'+rows+'</div>';
    wrap.appendChild(el);
  });

  /* ABOUT */
  var a=SITE.about;
  var aport=document.createElement("div");
  aport.className="aport";
  var aportPh='<div class="aport-ph"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Photo</span></div>';
  aport.innerHTML='<img src="'+esc(a.photo)+'" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"/><div class="aport-ph">'+aportPh.replace('<div class="aport-ph">','<div class="aport-ph" style="display:none">')+'</div>';
  document.getElementById("aboutWrap").innerHTML=
    '<div class="about-top">'+
      aport.outerHTML+
      '<div class="abio-top">'+
        '<h2 class="aname">'+bi(a.nameEn,a.nameZh)+'</h2>'+
        '<p class="arole">'+bi(a.roleEn,a.roleZh)+'</p>'+
        '<div class="abio">'+a.bioEn.map(function(p,i){return'<p>'+bi(p,a.bioZh[i]||'')+'</p>';}).join("")+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="contact-block">'+
      '<h3 class="chead">'+bih(a.contactHeadEnHtml,a.contactHeadZhHtml)+'</h3>'+
      '<ul class="clist">'+a.servicesEn.map(function(s,i){return'<li>'+bi(s,a.servicesZh[i]||'')+'</li>';}).join("")+'</ul>'+
      '<a href="mailto:'+esc(a.email)+'" class="ebtn"><span>'+bi(a.emailBtnEn,a.emailBtnZh)+'</span><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>'+
      '<p class="abio" style="margin-top:20px">'+bi(a.availabilityEn,a.availabilityZh)+'</p>'+
    '</div>'+
    '<div class="cvs"><div class="cvl"><span class="e">Experience</span><span class="h">工作经历</span></div><div class="cvg"><div>'+
      a.experience.map(function(e){return'<div class="cvi"><div class="cvyr">'+e.years+'</div><div class="cvti">'+bi(e.titleEn,e.titleZh)+'</div>'+(e.subtitleEn?'<div class="cvsu">'+bi(e.subtitleEn,e.subtitleZh)+'</div>':'')+'<div class="cvbo">'+bi(e.bodyEn,e.bodyZh)+'</div></div>';}).join("")+
    '</div><div><div class="cvi">'+
      '<div class="cvyr"><span class="e">'+a.education.yearsLabelEn+'</span><span class="h">'+a.education.yearsLabelZh+'</span></div>'+
      '<div class="cvti">'+bi(a.education.titleEn,a.education.titleZh)+'</div>'+
      '<div class="cvsu">'+bi(a.education.schoolEn,a.education.schoolZh)+'</div>'+
    '</div></div></div></div>'+
    '<div class="cvs"><div class="cvl"><span class="e">Skills</span><span class="h">技能</span></div>'+
      '<div class="skg">'+a.skillsEn.map(function(s,i){return'<div class="sk">'+bi(s,a.skillsZh[i]||'')+'</div>';}).join("")+'</div></div>'+
    '<div class="cvs"><div class="cvl"><span class="e">Languages</span><span class="h">语言</span></div>'+
      '<div style="max-width:360px">'+a.languages.map(function(l){return'<div class="lgi"><div class="lgrow"><span class="lgnm">'+l.name+'</span><span class="lglv">'+bi(l.levelEn,l.levelZh||'')+'</span></div><div class="lgbar"><div class="lgfi" data-w="'+l.width+'"></div></div></div>';}).join("")+'</div></div>';

  /* IMAGE ERROR */
  document.querySelectorAll(".wthumb img, .wthumb video, .wthumb-link img, .wthumb-link video").forEach(function(el){
    el.onerror=function(){
      if(el.tagName==="IMG"){this.style.display="none";var ph=this.parentElement.querySelector(".wph");if(ph)ph.style.display="flex";}
    };
  });

  /* CURSOR */
  document.addEventListener("mousemove",function(e){mx=e.clientX;my=e.clientY;if(CC){CC.style.left=mx+"px";CC.style.top=my+"px";}});
  (function lp(){rx+=(mx-rx)*.1;ry+=(my-ry)*.1;if(CR){CR.style.left=rx+"px";CR.style.top=ry+"px";}requestAnimationFrame(lp);})();
  document.querySelectorAll("a,button,.witem,.sk,.ppx,.ebtn").forEach(function(el){
    el.addEventListener("mouseenter",function(){document.body.classList.add("hov");});
    el.addEventListener("mouseleave",function(){document.body.classList.remove("hov");});
  });

  /* NAV SCROLL SPY */
  var panels=document.querySelectorAll(".panel");
  var navBtns=document.querySelectorAll(".nl");
  var spy=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        var id=en.target.dataset.id;
        navBtns.forEach(function(b){b.classList.toggle("act",b.getAttribute("href")==="#p-"+id);});
        if(id==="about"&&!lgDone){
          lgDone=true;
          document.querySelectorAll(".lgfi").forEach(function(f){
            f.style.width=(parseFloat(f.getAttribute("data-w"))*100)+"%";
            requestAnimationFrame(function(){f.style.transform="scaleX(1)";});
          });
        }
      }
    });
  },{rootMargin:"-45% 0px -45% 0px",threshold:0});
  panels.forEach(function(p){spy.observe(p);});

  window.tgl=function(){
    document.body.classList.toggle("zh");
    document.getElementById("llbl").textContent=document.body.classList.contains("zh")?"EN":"中文";
    if(curPop>=0)rp(curPop);
  };

  function rp(i){
    var p=SITE.projects[i],zh=document.body.classList.contains("zh");
    var lbl='<span class="e">'+p.titleEn+'</span><span class="h">'+p.titleZh+'</span>';
    if(p.website){lbl+=' <a href="'+esc(p.website)+'" target="_blank" rel="noopener">&#8599; Visit site</a>';}
    document.getElementById("pplabel").innerHTML=lbl;
    document.getElementById("ppyr").textContent=p.year;
    document.getElementById("pprl").textContent=zh?p.roleZh:p.roleEn;
    document.getElementById("ppti").innerHTML='<span class="e">'+p.titleEn+'</span><span class="h">'+p.titleZh+'</span>';
    document.getElementById("ppsu").innerHTML='<span class="e">'+p.subtitleEn+'</span><span class="h">'+p.subtitleZh+'</span>';
    document.getElementById("pptgs").innerHTML=(zh?p.tagsZh:p.tagsEn).map(function(t){return'<span class="pptg">'+t+'</span>';}).join("");
    document.getElementById("ppin").textContent=zh?p.introZh:p.introEn;
    document.getElementById("ppde").textContent=zh?p.descZh:p.descEn;
    document.getElementById("ppil").textContent=zh?"项目图片":"Project Images";
    document.getElementById("ppcr").textContent=zh?p.creditsZh:p.creditsEn;
  }

  window.openP=function(i){
    curPop=i;rp(i);
    var p=SITE.projects[i],h=document.getElementById("pphi");
    var siteBtn="";
    if(p.website){
      siteBtn='<a href="'+esc(p.website)+'" target="_blank" rel="noopener" class="pphi-site-btn" onclick="event.stopPropagation()">&#8599; <span class="e">Visit site</span><span class="h">访问网站</span></a>';
    }
    h.innerHTML='<div style="position:relative;display:inline-block;width:100%">'+'<img src="'+esc(p.img)+'" alt="" style="width:100%;display:block"/>'+siteBtn+'</div>';
    var ig=document.getElementById("ppig");ig.innerHTML="";
    (p.images||[]).forEach(function(src){
      var w=document.createElement("div");w.className="ppiw";
      var i2=new Image();i2.onload=function(){w.innerHTML='<img src="'+esc(src)+'" alt=""/>';};i2.onerror=function(){w.innerHTML='<div class="ppiph"><span>Add image</span></div>';};i2.src=src;
      ig.appendChild(w);
    });
    document.getElementById("pov").classList.add("on");
    document.getElementById("pp").classList.add("on");
  };

  window.cpop=function(){
    document.getElementById("pov").classList.remove("on");
    document.getElementById("pp").classList.remove("on");
    curPop=-1;
  };
})();
</script>
</body>
</html>
